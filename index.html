<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Cocktail Rush</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f5530">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cocktail Rush">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Caveat:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--felt:#17703f;--felt2:#0f5530;--felt3:#093a20;--wood:#6b3d1c;--ink:#f6f1e6;--mut:#b9d3c1;--acc:#ffc94a;--red:#d7262f;--paper:#f7f0df;--pink:#2b2118;--ok:#2f9e5b;--ko:#d23b30;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif;min-height:100%}
body{background:radial-gradient(ellipse at 50% 30%,#1d8048 0%,var(--felt2) 55%,var(--felt3) 100%) fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background:repeating-radial-gradient(circle at 30% 20%,rgba(0,0,0,.25) 0 1px,transparent 1px 3px),repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 5px)}
#app{position:relative;max-width:520px;margin:0 auto;padding:12px 12px 120px}
h1,h2,.disp{font-family:"Bricolage Grotesque",Inter,sans-serif;margin:0}
h1{font-size:38px;font-weight:800;letter-spacing:-.5px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
h2{font-size:21px;font-weight:800}
.mut{color:var(--mut)} .small{font-size:13px}
.panel{background:rgba(5,30,16,.55);border:1px solid rgba(255,255,255,.12);border-radius:var(--r);padding:14px;margin:10px 0;backdrop-filter:blur(3px)}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}
input.f{width:100%;background:rgba(255,255,255,.95);border:0;color:#1a1a1a;border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;outline:none}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:700 16px Inter,sans-serif;cursor:pointer;background:rgba(255,255,255,.12);color:var(--ink);border:1px solid rgba(255,255,255,.2)}
.btn.pri{background:var(--acc);color:#2a1a00;border-color:#e0a91f;box-shadow:0 4px 0 #b9850f}
.btn.pri:active{transform:translateY(3px);box-shadow:0 1px 0 #b9850f}
.btn.red{background:var(--red);border-color:#a3151d;color:#fff;box-shadow:0 4px 0 #8e1018}
.btn:disabled{opacity:.45}.btn+.btn{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:var(--ink);border-radius:999px;padding:9px 14px;font:600 14px Inter,sans-serif}
.chip.on{background:var(--acc);color:#2a1a00;border-color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-bottom:6px}
.top b{color:var(--ink)}
.xbtn{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.2);color:var(--ink);border-radius:10px;padding:5px 10px;font:inherit;font-size:13px}
/* ---- table ---- */
.tablewrap{padding:10px 4px}
.ptable{position:relative;height:300px;border-radius:50%/50%;background:radial-gradient(ellipse at 50% 40%,#25965a 0%,#16733f 60%,#0f5a31 100%);border:12px solid var(--wood);box-shadow:inset 0 0 0 3px #c79a4a,inset 0 0 40px rgba(0,0,0,.45),0 10px 24px rgba(0,0,0,.45);background-clip:padding-box}
.ptable::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(0,0,0,.35);pointer-events:none}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:52%}
.center .lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#d8f0df;opacity:.85}
.center .nm{font:800 22px/1.05 "Bricolage Grotesque",sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);margin-top:2px}
.center .code{font:800 34px "Bricolage Grotesque",sans-serif;letter-spacing:6px;color:var(--acc)}
.tag{position:absolute;transform:translate(-50%,-50%);background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;z-index:2}
.tag.me{background:var(--acc);color:#2a1a00;border-color:var(--acc)}
.slot{position:absolute;transform:translate(-50%,-50%);width:44px;height:62px;border-radius:7px;perspective:600px}
.slot.empty{border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:16px}
.cback,.cface{position:absolute;inset:0;border-radius:7px;box-shadow:0 3px 6px rgba(0,0,0,.4)}
.cback{background:var(--red);border:3px solid #fff;display:flex;align-items:center;justify-content:center}
.cback::before{content:"";position:absolute;width:70%;height:84%;border-radius:50%;background:#fff;transform:rotate(30deg)}
.cback span{position:relative;font:800 16px "Bricolage Grotesque";color:var(--red)}
.cface{background:var(--paper);color:var(--pink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1}
.cface .e{font:800 18px "Bricolage Grotesque"}.cface .p{font-size:11px;color:#2f7a4c;margin-top:3px}
.cface.best{box-shadow:0 0 0 3px var(--acc),0 3px 6px rgba(0,0,0,.4)}
.flipin{animation:flipin .8s ease both}
@keyframes flipin{0%{transform:rotateY(180deg) scale(1.1)}100%{transform:none}}
.drop{animation:drop .45s cubic-bezier(.2,1.4,.5,1) both}
@keyframes drop{0%{transform:translateY(-40px) scale(1.4) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
/* ---- carte papier ---- */
.paper{background:var(--paper);color:var(--pink);border-radius:14px;padding:14px 14px 10px;box-shadow:0 10px 24px rgba(0,0,0,.4);position:relative;transform:rotate(-.6deg)}
.paper::before{content:"";position:absolute;inset:6px;border:1.5px solid #2b2118;border-radius:10px;pointer-events:none;opacity:.8}
.paper .ttl{font:800 24px "Bricolage Grotesque";text-transform:uppercase;letter-spacing:.5px;padding:2px 4px 6px;border-bottom:2px solid #2b2118}
.fl{display:flex;align-items:baseline;gap:6px;border-bottom:1px dashed #b7a98d;padding:4px 4px 0}
.fl label{font:800 11px Inter;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;color:#4a3a2b}
.hw{flex:1;min-width:0;background:transparent;border:0;outline:none;font:600 24px/1.25 Caveat,cursive;color:#1b3fa0;padding:2px 0}
.hw::placeholder{color:#c8bba1}
.ihead{display:flex;font:800 11px Inter;letter-spacing:1px;text-transform:uppercase;color:#4a3a2b;padding:10px 4px 2px;border-bottom:2px solid #2b2118}
.ihead span:first-child{flex:1}.ihead span:last-child{width:96px;text-align:center}
.irow{display:flex;gap:6px;border-bottom:1px dashed #b7a98d;padding:0 4px;background:repeating-linear-gradient(transparent 0 0)}
.irow:nth-child(odd){background:rgba(0,0,0,.035)}
.irow .q{width:96px;flex:0 0 96px;text-align:center;border-left:1px solid #b7a98d}
.addl{background:none;border:0;color:#7a6a52;font:600 13px Inter;padding:8px 4px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(9,58,32,.95) 35%);z-index:5}
.bottom>div{max-width:520px;margin:0 auto}
.flyer{position:fixed;z-index:50;transition:all .7s cubic-bezier(.5,0,.3,1);pointer-events:none}
/* ---- révélation ---- */
.det{margin-top:8px;font-size:14px}
.det .it{display:flex;gap:8px;padding:5px 0;border-top:1px solid rgba(255,255,255,.12)}
.det .it .s{width:18px;text-align:center;font-weight:800}
.ok{color:#6fe39b}.ko{color:#ff8a80}
.prow{cursor:pointer}
.pts{font:800 22px "Bricolage Grotesque";color:var(--acc)}
.recipe .r{display:flex;justify-content:space-between;gap:10px;padding:5px 4px;border-bottom:1px dashed #b7a98d;font-size:14px}
.recipe .r span:last-child{font:700 20px/1.1 Caveat;color:#1b3fa0;text-align:right}
.score{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.you{color:var(--acc);font-size:12px;margin-left:4px}
.banner{background:rgba(120,20,20,.6);border:1px solid #ff8a80;color:#ffd6d2;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.hero{text-align:center;padding:16px 0 4px}
.hero .cards{display:flex;justify-content:center;gap:0;margin-bottom:8px}
.hero .cards .c{width:54px;height:76px;position:relative}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
#sheet.on{display:flex}
#sheet .in{background:#0f4a2a;border-top:2px solid var(--acc);width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 14px calc(16px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:12px;display:none;z-index:60;font-size:14px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:16px 0}
.pod{width:30%;text-align:center}
.pod .bar{background:var(--paper);color:var(--pink);border-radius:12px 12px 0 0;display:flex;justify-content:center;padding-top:8px;font:800 26px "Bricolage Grotesque"}
.thq{background:var(--paper);color:var(--pink);border-radius:16px;padding:18px 16px;box-shadow:0 10px 24px rgba(0,0,0,.4);margin:10px 0;min-height:150px}
.thq .meta{font-size:12px;color:#7a6a55;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.thq .q{font:800 21px/1.3 "Bricolage Grotesque",Inter,sans-serif;margin:10px 0 4px}
.thq .a{border-top:2px dashed #d9c9a8;margin-top:14px;padding-top:12px;font-size:18px;line-height:1.5;white-space:pre-line;color:#123a7a;font-weight:500}
.thq .warn{font-size:12px;color:#9a5a00;margin-top:8px}
.spk{border:0;background:#ece0c4;color:#2b2118;border-radius:999px;padding:6px 11px;font:600 13px Inter,sans-serif}
.thbar{height:8px;border-radius:9px;background:rgba(0,0,0,.3);overflow:hidden;margin:6px 0}.thbar i{display:block;height:100%;background:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .btn{margin:0!important;color:#fff}
.btn.ok{background:var(--ok);border-color:#3fbf72}.btn.ko{background:var(--ko);border-color:#ff6b5e}
.thli{background:rgba(5,30,16,.55);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px;margin:8px 0}
.thli .a{margin-top:8px;color:var(--acc);white-space:pre-line}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:var(--ink);border-radius:14px;padding:13px 14px;font:500 16px/1.35 Inter,sans-serif;cursor:pointer}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:14px}
.opt span{flex:1}.opt i{font-style:normal;font-weight:800;font-size:20px}
.opt.good{background:var(--ok);border-color:#5fd68f}.opt.bad{background:var(--ko);border-color:#ff8a80}.opt.dim{opacity:.45}
.tha{width:100%;resize:none;border-bottom:2px dashed #cdbb97!important;font-size:25px!important;line-height:1.3!important;padding:4px 2px!important;min-height:120px;display:block}
.dys{font-family:Verdana,Tahoma,sans-serif!important;letter-spacing:.04em;word-spacing:.12em}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"><div class="in" id="sheetin"></div></div>
<div id="toast"></div>
<script>
/* ================= DONNÉES (livre EBS, chap. 22) ================= */
const HB='Highball',RK='Rocks',CP='Martini / Coupe',FL='Champagne Flute';
const N='None',CU='Cubed',CR='Crushed';
const B='Build',SS='Shake & Strain',SFS='Shake & Fine Strain',SJ='Stir & Julep Strain';
const GLASSES=[HB,RK,CP,FL,'Shooter','Copper Mug','Julep Tin','Sour Glass'];
const ICES=[{v:N,l:'Sans glace'},{v:CU,l:'Cubes (Cubed)'},{v:CR,l:'Pilée (Crushed)'}];
const ICE_L={None:'Sans glace',Cubed:'Cubes',Crushed:'Pilée'};
const TECHS=[B,'Build & Stir','Build & Float','Build & Sink',SS,SFS,'Dry Shake, Shake & Strain','Dry Shake, Shake & Fine Strain','Shake, Strain & Float',SJ,'Muddle, Build & Churn','Muddle, Bash, Build & Churn','Soak, Muddle, Bash, Build & Churn','Layer in Order','Roll'];
const A=x=>Array.isArray(x)?x:[x];
const K=(n,g,i,t,ing,gar,o='')=>({n,g:A(g),i:A(i),t:A(t),ing,gar,o});
const C=[
K('Gin & Tonic',HB,CU,B,[['Gin','40'],['Tonic','Fill']],[['Lime Wedge']],'Vodka & Tonic : vodka à la place du gin'),
K('Cuba Libre',HB,CU,B,[['Light Rum','40'],['Fresh Lime Juice','10'],['Coca Cola','Fill']],[['Lime Wedge']],'Cubata : Dark Rum à la place du Light Rum'),
K('Tequila Sunrise',HB,CU,'Build & Sink',[['Tequila','40'],['Orange Juice','Fill'],['Grenadine','10']],[[]],'La grenadine coule au fond (sink)'),
K('Rusty Nail',RK,CU,B,[['Scotch Whisky','30'],['Drambuie','30']],[['Lemon Zest']]),
K('Godfather',RK,CU,B,[['Scotch Whisky','30'],['Amaretto','30']],[[]],'Godmother : vodka à la place du scotch'),
K('Black Russian',RK,CU,B,[['Vodka','40'],['Coffee Liqueur','20']],[[]]),
K('White Russian',RK,CU,B,[['Vodka','40'],['Coffee Liqueur','20'],['Milk','Fill']],[[]],'Crème ou half & half à la place du lait · Colorado Bulldog : top Coca Cola'),
K('Moscow Mule',[HB,'Copper Mug'],CU,B,[['Vodka','40'],['Fresh Lime Juice','20'],['Ginger Beer','Fill']],[['Lime Wedge']],'Missouri Mule : Southern Comfort · Jamaican Mule : Spiced Rum'),
K('El Diablo',HB,CU,B,[['Tequila','30'],['Crème de Cassis','10'],['Fresh Lime Juice','10'],['Ginger Ale','Fill']],[['Lime Wedge']]),
K('Sex on the Beach',HB,CU,B,[['Vodka','20'],['Peach Liqueur','20'],['Cranberry Juice','Fill equal parts'],['Orange Juice','Fill equal parts']],[[]]),
K('Cosmopolitan',CP,N,SFS,[['Citron Vodka','40'],['Triple Sec','20'],['Fresh Lime Juice','10'],['Cranberry Juice','30']],[['Orange Zest']],'Zeste d\'orange flambé'),
K('Woo Woo',HB,CU,B,[['Vodka','20'],['Peach Liqueur','20'],['Cranberry Juice','Fill']],[['Lime Wedge']],'Cape Codder : vodka à la place de la liqueur de pêche'),
K('Americano',RK,CU,'Build & Stir',[['Sweet Vermouth','30'],['Campari','30'],['Soda Water','30']],[['Orange Zest'],['Orange Slice']]),
K('Screaming Orgasm',RK,CU,SS,[['Vodka','10'],['Coffee Liqueur','10'],['Amaretto','10'],['Baileys','10'],['Milk','40']],[[]],'Crème ou half & half à la place du lait · Orgasm : sans vodka'),
K("Horse's Neck",HB,CU,B,[['Aromatic Bitters','2 dashes'],['Bourbon','40'],['Ginger Ale','Fill']],[['Lemon Spiral']],'Brandy à la place du bourbon'),
K('Tom Collins',HB,CU,SS,[['Gin','60'],['Fresh Lemon Juice','30'],['Sugar Syrup','15'],['Soda Water','Top']],[['Lemon Wedge']],'John Collins : bourbon à la place du gin'),
K('Long Island Iced Tea',HB,CU,SS,[['Vodka','20'],['Light Rum','20'],['Gin','20'],['Tequila','20'],['Triple Sec','20'],['Fresh Lemon Juice','20'],['Sugar Syrup','10'],['Coca Cola','Top']],[['Lemon Wedge']],'Long Beach : cranberry à la place du coca · Beverly Hills : champagne'),
K('Dry Martini',CP,N,SJ,[['Dry Vermouth','1 barspoon'],[['Gin','Vodka'],'60']],[['Olives'],['Lemon Zest']],'Naked : gin seul · Dirty : 2 barspoons de saumure d\'olive · Wet : plus de vermouth · Gibson : oignons grelots'),
K('Manhattan (Sweet)',CP,N,SJ,[['Aromatic Bitters','2 dashes'],['Sweet Vermouth','20'],['Bourbon','60']],[['Cherry']],'Dry : vermouth dry + zeste de citron · Perfect : les deux vermouths, les deux garnitures'),
K('Rob Roy',CP,N,SJ,[['Aromatic Bitters','2 dashes'],['Sweet Vermouth','20'],['Scotch Whisky','60']],[['Cherry']]),
K('Paloma',HB,CU,SS,[['Tequila','60'],['Pink Grapefruit Juice','60'],['Fresh Lime Juice','10'],['Sugar Syrup','10'],['Soda Water','Top']],[['Salt Rim','Grapefruit Slice']]),
K('Margarita',CP,N,SFS,[['Tequila','40'],['Triple Sec','20'],['Fresh Lime Juice','30'],['Sugar Syrup','10']],[['Salt Rim']],"Tommy's : sirop d'agave à la place du triple sec et du sucre · Frozen : 1 pelle de glace pilée, sucre x2"),
K('Side Car',CP,N,SFS,[['Cognac','40'],['Triple Sec','20'],['Fresh Lemon Juice','30'],['Sugar Syrup','10']],[['Sugar Rim']]),
K('Amaretto Sour',RK,CU,'Dry Shake, Shake & Strain',[['Aromatic Bitters','2 dashes'],['Foamer','5 dashes'],['Amaretto','60'],['Fresh Lemon Juice','30'],['Sugar Syrup','10']],[['Lemon Wedge','Cherry']],'Midori Sour : Midori à la place de l\'amaretto'),
K('Whiskey Sour',['Sour Glass',RK],[N,CU],['Dry Shake, Shake & Fine Strain','Dry Shake, Shake & Strain'],[['Aromatic Bitters','2 dashes'],['Foamer','5 dashes'],['Bourbon','60'],['Fresh Lemon Juice','30'],['Sugar Syrup','15']],[['Orange Zest','Cherry']],'Sour glass sans glace (fine strain) ou rocks sur glaçons (strain) · New York Sour : top vin rouge'),
K('Clover Club',CP,N,'Dry Shake, Shake & Fine Strain',[['Foamer','5 dashes'],['Raspberry Puree','15'],['Gin','60'],['Fresh Lemon Juice','30']],[['Raspberry']]),
K('Bramble',RK,CR,'Shake, Strain & Float',[['Gin','40'],['Fresh Lemon Juice','20'],['Sugar Syrup','10'],['Crème de Mûre','20']],[['Lemon Wedge','2 Blackberries']],'La crème de mûre se verse en float à la fin'),
K('Mojito',HB,CR,'Muddle, Bash, Build & Churn',[['Lime Wedges','4 wedges'],['Sugar Syrup','20'],['Mint Leaves','8-12 leaves'],['Light Rum','60'],['Soda Water','Fill']],[['Mint Sprig']],'Fruit Mojito : fruits + liqueur de fruit'),
K('Caipirinha',RK,CR,'Muddle, Build & Churn',[['Lime Wedges','6 wedges'],['Sugar Syrup','20'],['Cachaça','60']],[['Lime Wedge']],'Caipiroska : vodka · Fruit Caipirinha : fruits + liqueur'),
K('Mint Julep',[RK,'Julep Tin'],CR,'Soak, Muddle, Bash, Build & Churn',[['Bittered Sugar Cube','1 cube'],['Soda Water','1 barspoon'],['Mint Leaves','8-12 leaves'],['Bourbon','60']],[['Mint Sprig']]),
K('Gin Basil Smash',RK,CU,SFS,[['Basil Leaves','8-12 leaves'],['Gin','60'],['Fresh Lemon Juice','30'],['Sugar Syrup','15']],[['Basil Leaf']]),
K('Southside',CP,N,SFS,[['Mint Leaves','8-12 leaves'],['Gin','60'],['Fresh Lime Juice','30'],['Sugar Syrup','15']],[['Single Mint Leaf']]),
K('B52','Shooter',N,'Layer in Order',[['Coffee Liqueur','20'],['Baileys','20'],['Triple Sec','20']],[[]],'Cointreau à la place du triple sec'),
K('Pornstar Martini',CP,N,SFS,[['Vodka','40'],['Passionfruit Liqueur','20'],['Passionfruit Puree','20'],['Fresh Lime Juice','20'],['Vanilla Syrup','10'],['Brut Champagne','Shot on the side']],[['Dehydrated Lime Wheel']],'Upgrade : vodka vanille + passion fraîche'),
K('Bellini',FL,N,B,[['Peach Puree','10'],['Peach Liqueur','10'],['Prosecco','Fill']],[[]],'Rossini : purée et liqueur de fraise'),
K('French 75',FL,N,SFS,[['Gin','40'],['Fresh Lemon Juice','20'],['Sugar Syrup','10'],['Champagne','Top']],[['Lemon Zest']]),
K('Last Word',CP,N,SFS,[['Gin','20'],['Maraschino','20'],['Fresh Lime Juice','20'],['Green Chartreuse','20']],[['Cherry']]),
K('Naked & Famous',CP,N,SFS,[['Mezcal','20'],['Aperol','20'],['Yellow Chartreuse','20'],['Fresh Lime Juice','20']],[[]]),
K('Old Fashioned',RK,CU,SJ,[['Aromatic Bitters','2 dashes'],['Bourbon','60'],['Sugar Syrup','10']],[['Orange Zest']],'N\'importe quel spiritueux vieilli à la place du bourbon'),
K('Dark & Stormy',HB,CU,'Build & Float',[['Fresh Lime Juice','20'],['Ginger Beer','Fill'],['Dark Rum','40']],[['Lime Wedge']],'Original : Goslings Black Rum · Fidel Castro : build + ginger ale'),
K('Hemingway Daiquiri',CP,N,SFS,[['Light Rum','50'],['Maraschino','10'],['Fresh Lime Juice','20'],['Grapefruit Juice','20']],[['Cherry']],'On the rocks : verre rocks avec glaçons'),

const nz=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[’']/g,' ').replace(/[^a-z0-9.,\- ]/g,' ').replace(/\s+/g,' ').trim();

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}

/* Orthographe souple (dyslexie) : on compare les mots par leur SON (clé phonétique FR/EN) + quelques lettres d'écart.
   « shack » = shake, « frees lemon jus » = fresh lemon juice, « hightbaul » = highball, « glasons » = glaçons… */
function pkey(w){
  w=nz(w).replace(/[^a-z0-9]/g,'');if(w.length<2||/^\d+$/.test(w))return w;
  w=w.replace(/ph/g,'f').replace(/sch/g,'sh').replace(/ch/g,'sh').replace(/ck/g,'k').replace(/qu?/g,'k').replace(/c(?=[eiy])/g,'s').replace(/c/g,'k')
     .replace(/dg(?=[eiy])/g,'j').replace(/g(?=[eiy])/g,'j').replace(/x/g,'ks').replace(/z/g,'s').replace(/gh/g,'').replace(/y/g,'i').replace(/w/g,'v')
     .replace(/eau/g,'o').replace(/au/g,'o').replace(/(ee|ea|ie|ei)/g,'i').replace(/(ai|ay)/g,'e').replace(/(oo|ou|eu)/g,'u').replace(/ui/g,'u')
     .replace(/([^s])h/g,'$1').replace(/^h/,'').replace(/(.)\1+/g,'$1');
  if(w.length>3)w=w.replace(/e?s$|[ei]$/,'');
  return w;
}
const tol=n=>n<=3?0:n<=5?1:n<=8?2:3;
function wclose(a,b){if(a===b)return true;const ka=pkey(a),kb=pkey(b);if(ka===kb)return true;const t=tol(Math.min(ka.length,kb.length,b.length));return lev(ka,kb)<=t||lev(a,b)<=t;}
/* Tous les mots de l'alias retrouvés (dans n'importe quel ordre) parmi les mots tapés ? Renvoie le nb de mots tapés inutilisés, ou -1. */
function wordsFit(inW,alW){const used=new Set();for(const aw of alW){let k=inW.findIndex((w,i)=>!used.has(i)&&wclose(w,aw));if(k<0)return -1;used.add(k);}return inW.length-used.size;}
/* Remplace chaque mot mal écrit par le mot connu le plus proche (pour la technique, la glace, les doses). */
function fixWords(text,voc){return nz(text).split(' ').map(w=>{if(!w||/\d/.test(w)||voc.includes(w))return w;let best=null,bd=99;for(const v of voc){if(!wclose(w,v))continue;const d=lev(pkey(w),pkey(v));if(d<bd){bd=d;best=v;}}return best||w;}).join(' ');}
function findIn(text,idx){
  const t=clean(text);if(!t)return null;
  let h=idx.find(x=>x.a===t);if(h)return h.canon;
  h=idx.find(x=>(' '+t+' ').includes(' '+x.a+' '));if(h)return h.canon;
  let best=null,br=0;for(const x of idx){const r=ratio(t,x.a);if(r>br){br=r;best=x;}}
  if(br>=0.8)return best.canon;
  /* mot à mot, au son */
  const inW=t.split(' ');let fb=null,fl=-1,fx=99;
  for(const x of idx){const left=wordsFit(inW,x.a.split(' '));if(left<0)continue;if(x.a.length>fl||(x.a.length===fl&&left<fx)){fb=x;fl=x.a.length;fx=left;}}
  if(fb)return fb.canon;
  /* mots collés ou coupés (« lemonjuice », « high ball ») */
  const kt=t.split(' ').map(pkey).join('');best=null;br=0;
  for(const x of idx){const r=ratio(kt,x.a.split(' ').map(pkey).join(''));if(r>br){br=r;best=x;}}
  return br>=0.8?best.canon:null;
}

function twords(t){const out=[];let neg=false;for(const w of nz(t).replace(/(\d)([a-z])/g,'$1 $2').replace(/([a-z])(\d)/g,'$1 $2').replace(/[.,\-\/]/g,' ').split(' ')){if(!w||TSTOP.has(w))continue;if(TNEG.has(w)){neg=true;continue;}out.push(neg?'!'+w:w);neg=false;}return out;}
function twMatch(w,aw){
  if((w[0]==='!')!==(aw[0]==='!'))return false;if(w[0]==='!'){w=w.slice(1);aw=aw.slice(1);}
  const star=aw.endsWith('*'),st=star?aw.slice(0,-1):aw;
  if(/\d/.test(st))return star?w.startsWith(st):w===st;
  if(star){if(w.startsWith(st))return true;if(w.length<st.length-1)return false;return st.length>3&&wclose(w.slice(0,st.length),st);}
  return wclose(w,st);
}
function tterms(x){const ws=twords(x.replace(/\*/g,' STAR').replace(/ STAR/g,'zzstar'));return ws.map(w=>w.replace(/zzstar/g,'*'));}
function thGradeTxt(txt,q){
  const W=twords(txt||'');
  const groups=q.k.split(',').map(g=>g.split('|').map(x=>x.trim()).filter(Boolean));
  const anchors=[...new Set(groups.flat().filter(x=>x.includes('~')).map(x=>x.split('~')[0].trim()))].map(x=>tterms(x)[0]);
  const has=al=>{const ws=tterms(al);return ws.length&&ws.every(aw=>W.some(w=>twMatch(w,aw)));};
  const near=(A,B)=>{const a=tterms(A)[0],b=tterms(B);if(!a||!b.length)return false;
    for(let i=0;i<W.length;i++){if(!twMatch(W[i],a))continue;for(let j=i+1;j<W.length;j++){if(b.every(bw=>W.slice(j,j+b.length).some(w=>twMatch(w,bw))))return true;if(anchors.some(an=>an!==a&&twMatch(W[j],an)))break;}}return false;};
  let hit=0;const got=[];
  for(const alts of groups){const ok=alts.find(al=>al.includes('~')?near(...al.split('~')):has(al));if(ok){hit++;got.push(ok);}}
  const r=groups.length?hit/groups.length:0;
  const e=!W.length?2:r>=0.74?0:(hit&&r>=0.34)?1:2;
  return {e,hit,n:groups.length,got};
}

function grade(a,c){
  const items=[];let e=0;a=a||{};
  const chk=(label,ok,given,exp,und)=>{items.push({label,ok,given,exp,und});if(!ok)e++;};
  const gl=glassesIn(a.g);chk('Verre',gl.length>0&&gl.every(x=>c.g.includes(x)),a.g||'—',c.g.join(' ou '),gl.join(' / '));
  const ic=iceOf(a.i);chk('Glaçons',!!ic&&c.i.includes(ic),a.i||'—',c.i.map(x=>ICE_L[x]).join(' ou '),ICE_L[ic]||'');
  const tk=toks(a.t);chk('Technique',!!tk&&c.t.map(toks).includes(tk),a.t||'—',c.t.join(' ou '),'');
  const rows=(a.ing||[]).filter(r=>r&&nz(r[0])).map(r=>({raw:r[0],q:r[1],canon:findIn(r[0],ING_IDX),used:false}));
  for(const [n,q] of c.ing){
    const names=A(n);const r=rows.find(x=>!x.used&&names.includes(x.canon));
    if(!r)chk(fname(n),false,'oublié',fq(q));
    else{r.used=true;chk(fname(n),pq(r.q)===pq(q),r.q||'pas de dose',fq(q),r.raw);}
  }
  rows.filter(r=>!r.used).forEach(r=>chk(r.raw,false,(r.q||'')+' · en trop','pas dans la recette',r.canon?r.canon:'non reconnu'));
  const gs=garOf(a.gar);const fg=al=>al.length?al.join(' + '):'Aucune';
  chk('Décoration',Array.isArray(gs)&&c.gar.some(al=>al.length===gs.length&&al.every(x=>gs.includes(x))),a.gar||'—',c.gar.map(fg).join(' ou '),gs?gs.map(x=>x[0]==='?'?x.slice(1)+' (?)':x).join(' + '):'');
  return {e,items};
}

// Interface commune : {mode, myId, set(patch), on(cb(list)), leave()}  — list = [{id, s, me}]
function netSolo(){
  const s={};let cb=()=>{};
  const fire=()=>setTimeout(()=>cb([{id:'solo',s:JSON.parse(JSON.stringify(s)),me:true}]),0);
  return {mode:'solo',myId:'solo',set(p){Object.assign(s,p);fire();},on(f){cb=f;fire();},leave(){}};
}
async function netRoom(code){
  const room=await window.claude.use('room');
  if(!room)throw new Error('ROOM_NULL');
  const r=await room.join('ckt-'+code.toLowerCase());
  let myId=null;
  return {mode:'room',get myId(){return myId;},
    set(p){return r.presence(p).catch(()=>{});},
    on(f){r.onPeers(ch=>{const l=ch.peers.filter(p=>p.kind!=='agent').map(p=>({id:p.peer,s:p.presence||{},me:p.sameTab}));const m=l.find(x=>x.me);if(m)myId=m.id;f(l);},e=>toast('Salle : '+e.code));},
    leave(){r.leave().catch(()=>{});}};
}
/* Relais MQTT public (WebSocket sécurisé) : marche en 4G/5G et Wi-Fi, sans connexion directe entre téléphones.
   Chaque joueur publie son état en "retained" sur cocktailrush-ebs/v1/CODE/ID ; à la déconnexion, le "last will" l'efface. */
/* Plusieurs relais publics en parallèle : si l'un est en panne ou bloqué par le réseau, les autres prennent le relais.
   Chaque état porte un numéro de version (_v) : on garde toujours le plus récent, quel que soit le relais qui l'apporte. */
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=()=>res();s.onerror=()=>{s.remove();rej();};document.head.appendChild(s);});}
async function loadMqtt(){if(window.mqtt)return;
  for(const src of ['mqtt.min.js','https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js','https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js']){try{await loadScript(src);if(window.mqtt)return;}catch(_){}}
  throw new Error('Impossible de charger le module réseau. Vérifie ta connexion internet puis recharge la page.');}
async function netMqtt(code){
  await loadMqtt();
  return new Promise((res,rej)=>{
    const id=Math.random().toString(36).slice(2,10),base='cocktailrush-ebs/v2/'+code+'/';
    const mine={_v:0},by=BROKERS.map(()=>({}));let cb=()=>{},t=null,done=false,failed=0;
    const view=()=>{const m={};by.forEach(st=>{for(const [k,s] of Object.entries(st))if(!m[k]||(s._v||0)>(m[k]._v||0))m[k]=s;});m[id]={...mine};
      return Object.entries(m).map(([k,s])=>({id:k,s,me:k===id}));};
    const fire=()=>{clearTimeout(t);t=setTimeout(()=>cb(view()),0);};
    const cl=BROKERS.map((url,bi)=>{
      let c;try{c=mqtt.connect(url,{clientId:'cr_'+id+'_'+bi+Date.now().toString(36),clean:true,reconnectPeriod:2000,connectTimeout:7000,keepalive:20,will:{topic:base+id,payload:'',retain:true,qos:1}});}catch(_){failed++;return null;}
      let ever=false;
      c.on('connect',()=>{ever=true;c.subscribe(base+'+',{qos:1});if(mine._v)c.publish(base+id,JSON.stringify(mine),{retain:true,qos:1});
        if(!done){done=true;clearTimeout(to);setTimeout(()=>res(api),1200);}});
      c.on('message',(topic,buf)=>{const k=topic.slice(base.length);if(k===id)return;const str=buf.toString();if(!str)delete by[bi][k];else{try{by[bi][k]=JSON.parse(str);}catch(_){}}fire();});
      c.on('error',()=>{});
      c.on('close',()=>{if(!ever&&++c._f===1){failed++;if(!done&&failed>=BROKERS.length){done=true;clearTimeout(to);rej(new Error('Aucun serveur de jeu joignable depuis ce réseau. Essaie en 4G/5G ou sur un autre Wi-Fi.'));}}});
      c._f=0;return c;});
    const up=()=>cl.filter(c=>c&&c.connected);
    const pub=()=>{const p=JSON.stringify(mine);up().forEach(c=>c.publish(base+id,p,{retain:true,qos:1}));};
    let wasOff=false;setInterval(()=>{const n=up().length;if(done){if(!n&&!wasOff){wasOff=true;toast('Connexion perdue, reconnexion…');}else if(n&&wasOff){wasOff=false;toast('Reconnecté');pub();}}},2000);
    const api={mode:'mqtt',myId:id,
      set(p){Object.assign(mine,JSON.parse(JSON.stringify(p)));mine._v=Date.now()*100+((mine._v%100)+1)%100;pub();fire();},
      on(f){cb=f;fire();},
      leave(){cl.forEach(c=>{if(!c)return;try{c.publish(base+id,'',{retain:true,qos:1},()=>c.end(true));setTimeout(()=>c.end(true),800);}catch(_){}});},
      connected:()=>up().length>0};
    const to=setTimeout(()=>{if(!done){done=true;cl.forEach(c=>c&&c.end(true));rej(new Error('Serveur de jeu injoignable. Vérifie ta connexion internet.'));}},12000);
  });
}
function waitHost(net,ms){return new Promise(res=>{let ok=false;net.on(l=>{if(!ok&&l.some(p=>p.s.role==='host')){ok=true;res(true);}});setTimeout(()=>res(ok),ms);});}

const S={net:null,peers:[],isHost:false,code:'',G:null,form:null,formRound:-1,sentRound:-1,t0:0,key:'',flipped:{},open:{},err:'',seenHost:false,total:10,flying:false,kind:'cocktail',part:'all'};

const blank=()=>({g:'',i:'',t:'',ing:[['',''],['',''],['',''],['','']],gar:''});
const myId=()=>S.net&&S.net.myId;
const hostPeer=()=>S.peers.find(p=>p.s.role==='host');
const getG=()=>S.isHost?S.G:(hostPeer()?.s.G||null);
const nameOf=(id,G)=>(G&&G.names&&G.names[id])||(S.peers.find(p=>p.id===id)?.s.name)||'Joueur';
const players=()=>S.peers.filter(p=>p.s.role);

function pushG(){S.net.set({G:JSON.parse(JSON.stringify(S.G))});render();}
function onPeers(list){S.peers=list;if(hostPeer())S.seenHost=true;if(S.isHost)hostTick();render();}
function hostTick(){
  const G=S.G;if(!G||G.phase!=='play')return;let ch=false;
  for(const p of S.peers)if(G.players.includes(p.id)&&p.s.ar===G.round&&p.s.ans&&!G.sub.includes(p.id)){G.sub.push(p.id);G.subT[p.id]=Math.round((Date.now()-G.st)/1000);ch=true;}
  const present=G.players.filter(id=>S.peers.some(p=>p.id===id));
  if(present.length&&present.every(id=>G.sub.includes(id))){setTimeout(()=>{if(S.G.phase==='play')doReveal();},900);if(ch)pushG();return;}
  if(ch)pushG();
}
function thRescore(G){const n=G.players.length;const ranked=G.players.filter(id=>G.res[id]&&G.res[id].e!=null).sort((x,y)=>G.res[x].e-G.res[y].e||G.res[x].o-G.res[y].o);
  G.players.forEach(id=>{if(G.res[id]){G.res[id].pts=0;G.res[id].rk=null;}});
  ranked.forEach((id,k)=>{const r=G.res[id];r.rk=k+1;r.pts=r.e===2?0:(n-k)+(r.e===0?2:0);});
  G.players.forEach(id=>{G.scores[id]=(G.base[id]||0)+((G.res[id]&&G.res[id].pts)||0);});}
function hostVerdict(id,e){const G=S.G;if(!S.isHost||!G||G.phase!=='reveal'||!G.res[id]||G.res[id].e==null)return;G.res[id].e=e;G.res[id].fix=1;thRescore(G);pushG();render(true);}
function doReveal(){
  if(isTh(S.G)){const G=S.G,q=TQ[G.cid];G.ans={};G.res={};G.base={...G.scores};
    G.sub.filter(id=>G.players.includes(id)).forEach((id,ix)=>{const a=S.peers.find(p=>p.id===id)?.s.ans||null;G.ans[id]=a;G.res[id]={e:thGradeTxt(a&&a.txt,q).e,o:ix+1};});
    G.players.forEach(id=>{if(!G.res[id])G.res[id]={e:null,rk:null,pts:0};});thRescore(G);
    if(JSON.stringify(G).length>6000)G.ans=null;G.phase='reveal';pushG();return;}
  const G=S.G,c=C[G.cid],n=G.players.length;G.ans={};G.res={};
  const ranked=G.sub.filter(id=>G.players.includes(id)).map((id,ix)=>{const a=S.peers.find(p=>p.id===id)?.s.ans||null;G.ans[id]=a;return {id,e:grade(a,c).e,ix};}).sort((x,y)=>x.e-y.e||x.ix-y.ix);
  ranked.forEach((r,k)=>{G.res[r.id]={e:r.e,rk:k+1,pts:(n-k)+(r.e===0?2:0),o:r.ix+1};});
  G.players.forEach(id=>{if(!G.res[id])G.res[id]={e:null,rk:null,pts:0};G.scores[id]=(G.scores[id]||0)+G.res[id].pts;});
  if(JSON.stringify(G).length>3000)G.ans=null;
  G.phase='reveal';pushG();
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function snapshotPlayers(G){for(const p of players()){if(!G.players.includes(p.id))G.players.push(p.id);G.names[p.id]=p.s.name||'Joueur';if(G.scores[p.id]==null)G.scores[p.id]=0;}G.players=G.players.filter(id=>S.peers.some(p=>p.id===id));}
const thIdx=part=>TQ.map((q,i)=>i).filter(i=>part==='all'||TQ[i].p===part);
function startGame(){const th=S.kind==='theory';const pool=th?thIdx(S.part):C.map((_,i)=>i);const total=Math.min(S.total,pool.length);const deck=shuffle(pool).slice(0,total);
  S.G={phase:'play',kind:S.kind,round:1,total,deck,cid:deck[0],players:[],names:{},scores:{},sub:[],subT:{},st:Date.now(),res:null,ans:null};snapshotPlayers(S.G);pushG();}
function nextRound(){const G=S.G;if(G.round>=G.total){G.phase='end';pushG();return;}
  G.round++;G.cid=G.deck[G.round-1];G.phase='play';G.sub=[];G.subT={};G.res=null;G.ans=null;G.st=Date.now();snapshotPlayers(G);pushG();}
function backToLobby(){S.G={phase:'lobby'};pushG();}
const isTh=G=>G&&G.kind==='theory';
const centerOf=G=>isTh(G)?`<div class="lbl">Question ${G.round}</div><div class="nm" style="font-size:15px">${esc(TQ[G.cid].p)}</div>`:`<div class="lbl">Cocktail</div><div class="nm">${esc(C[G.cid].n)}</div>`;

const code4=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
function saveName(){const v=(document.getElementById('nm')?.value||'').trim().slice(0,14);NAME=v;try{localStorage.setItem('cr_name',v);}catch(_){}return v;}
const ROOMMSG='Le multijoueur n\'est pas dispo dans cette vue Claude. Ouvre la version GitHub Pages, ou joue en solo.';
async function create(){
  if(!saveName())return fail('Entre ton prénom d\'abord');busy(true);
  try{let code=code4(),net;
    net=IN_CLAUDE()?await netRoom(code):await netMqtt(code);
    S.net=net;S.isHost=true;S.code=code;S.G={phase:'lobby'};net.on(onPeers);net.set({name:NAME,role:'host',G:S.G});
  }catch(e){return fail(e.message==='ROOM_NULL'?ROOMMSG:('Impossible de créer la partie : '+(e.message||e)));}
  S.err='';render(true);
}
async function join(){
  if(!saveName())return fail('Entre ton prénom d\'abord');
  const code=(document.getElementById('cd')?.value||'').trim().toUpperCase();if(code.length!==4)return fail('Le code fait 4 caractères');busy(true);
  try{const net=IN_CLAUDE()?await netRoom(code):await netMqtt(code);
    if(!IN_CLAUDE()&&!(await waitHost(net,9000))){net.leave();throw new Error('Aucune table ouverte avec le code '+code+'. Vérifie le code, et que l\'hôte a bien l\'écran de la table ouvert.');}
    S.net=net;S.isHost=false;S.code=code;net.on(onPeers);net.set({name:NAME,role:'player'});}
  catch(e){return fail(e.message==='ROOM_NULL'?ROOMMSG:e.message||String(e));}
  S.err='';render(true);
}
function solo(){if(!saveName())NAME='Moi';S.net=netSolo();S.isHost=true;S.code='SOLO';S.G={phase:'lobby'};S.net.on(onPeers);S.net.set({name:NAME,role:'host',G:S.G});render(true);}
function quit(){if(S.net)S.net.leave();Object.assign(S,{net:null,peers:[],isHost:false,code:'',G:null,form:null,formRound:-1,sentRound:-1,key:'',seenHost:false,err:''});render(true);}

function submitCard(force){
  const f=S.form,G=getG();
  if(isTh(G)){if(!nz(f.txt)&&!force){sheet(`<h2>Tu n'as rien écrit</h2><p class="mut">Une réponse vide compte comme fausse.</p><button class="btn red" onclick="closeSheet();submitCard(true)">Envoyer quand même</button><button class="btn" onclick="closeSheet()">Continuer à écrire</button>`);return;}
    S.net.set({ans:{txt:f.txt.trim().slice(0,300)},ar:G.round});flyCard(()=>{S.sentRound=G.round;render(true);});return;}
  const miss=[];if(!nz(f.g))miss.push('verre');if(!nz(f.i))miss.push('glaçons');if(!nz(f.t))miss.push('technique');if(!f.ing.some(r=>nz(r[0])))miss.push('ingrédients');if(!nz(f.gar))miss.push('décoration');
  if(miss.length&&!force){sheet(`<h2>Il manque : ${miss.join(', ')}</h2><p class="mut">Une case vide compte comme une erreur. (Pas de déco ? écris « aucune ».)</p><button class="btn red" onclick="closeSheet();submitCard(true)">Envoyer quand même</button><button class="btn" onclick="closeSheet()">Continuer à écrire</button>`);return;}
  const ans={g:f.g.trim(),i:f.i.trim(),t:f.t.trim(),ing:f.ing.filter(r=>nz(r[0])||nz(r[1])).map(r=>[r[0].trim(),r[1].trim()]),gar:f.gar.trim()};
  S.net.set({ans,ar:G.round});
  flyCard(()=>{S.sentRound=G.round;render(true);});
}
function flyCard(done){
  const p=document.querySelector('.paper'),tg=document.getElementById('slot-me');
  if(!p||!tg){done();return;}
  const a=p.getBoundingClientRect(),b=tg.getBoundingClientRect();
  const fl=document.createElement('div');fl.className='flyer';
  fl.style.cssText=`left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;border-radius:14px;background:var(--paper);box-shadow:0 10px 24px rgba(0,0,0,.4)`;
  document.body.appendChild(fl);p.style.visibility='hidden';
  window.scrollTo({top:0,behavior:'smooth'});
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const b2=tg.getBoundingClientRect();
    fl.style.left=b2.left+'px';fl.style.top=b2.top+'px';fl.style.width=b2.width+'px';fl.style.height=b2.height+'px';fl.style.borderRadius='7px';fl.style.background='var(--red)';fl.style.transform='rotate(540deg)';}));
  setTimeout(()=>{fl.remove();done();},760);
}

const TPARTS=['Liqueurs','Tequila & Mezcal','Rhum','Bière','Mélange'];
const TH={on:false,mode:'menu',part:'all',deck:[],i:0,show:false,ok:0,ko:0,big:false,opts:[],pick:-1};
function thLoad(){try{return JSON.parse(localStorage.getItem('cr_theorie')||'{}');}catch(_){return {};}}
function thSave(m){try{localStorage.setItem('cr_theorie',JSON.stringify(m));}catch(_){}}
let THM=thLoad();try{TH.big=localStorage.getItem('cr_dys')==='1';}catch(_){}
const thPool=()=>TQ.filter(q=>TH.part==='all'||q.p===TH.part);
const thShuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function thOpen(){TH.on=true;TH.mode='menu';S.key='';render(true);}
function thClose(){TH.on=false;thStop();S.key='';render(true);}
function thStart(kind){
  let pool=thPool();
  if(kind==='review')pool=pool.filter(q=>THM[q.n]===0);
  if(kind==='new')pool=pool.filter(q=>THM[q.n]==null);
  if(!pool.length){toast(kind==='review'?'Aucune question à revoir ici 🎉':'Tu as déjà vu toutes ces questions');return;}
  Object.assign(TH,{mode:'quiz',deck:kind==='order'?pool:thShuf(pool),i:0,show:false,ok:0,ko:0,pick:-1});TH.opts=thShuf(TH.deck[0].c);render(true);scrollTo(0,0);
}
function thList(){TH.mode='list';render(true);scrollTo(0,0);}
function thPick(k){if(TH.show)return;const q=TH.deck[TH.i];TH.pick=k;TH.show=true;const ok=TH.opts[k]===q.c[0];THM[q.n]=ok?1:0;thSave(THM);ok?TH.ok++:TH.ko++;thStop();try{navigator.vibrate&&navigator.vibrate(ok?30:[60,40,60]);}catch(_){}render(true);}
function thNext(){thStop();if(TH.i+1>=TH.deck.length)TH.mode='end';else{TH.i++;TH.show=false;TH.pick=-1;TH.opts=thShuf(TH.deck[TH.i].c);}render(true);scrollTo(0,0);}
function thSay(txt){try{const u=new SpeechSynthesisUtterance(txt);u.lang='fr-FR';u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(_){toast('Lecture vocale indisponible sur ce téléphone');}}
function thStop(){try{speechSynthesis.cancel();}catch(_){}}
function thSayQ(){const q=TH.deck[TH.i];thSay(q.q+'. '+TH.opts.map((o,k)=>'ABCD'[k]+' : '+o).join('. '));}
function thSayA(){const q=TH.deck[TH.i];thSay(q.a.replace(/\n/g,'. '));}
function thBig(){TH.big=!TH.big;try{localStorage.setItem('cr_dys',TH.big?'1':'0');}catch(_){}render(true);}
function thReset(){if(!window.__r){window.__r=1;toast('Appuie encore pour tout remettre à zéro');setTimeout(()=>window.__r=0,2500);return;}THM={};thSave(THM);render(true);}
function thStats(pool){let ok=0,ko=0;for(const q of pool){if(THM[q.n]===1)ok++;else if(THM[q.n]===0)ko++;}return {ok,ko,n:pool.length};}
function vTheory(){
  const top=`<div class="top"><span>📚 Théorie EBS</span><span class="row"><button class="xbtn" onclick="thBig()">${TH.big?'Aa police normale':'Aa police lisible'}</button><button class="xbtn" onclick="${TH.mode==='menu'?'thClose()':"TH.mode='menu';thStop();render(true)"}">${TH.mode==='menu'?'Accueil':'Menu'}</button></span></div>`;
  const D=TH.big?' dys':'';
  if(TH.mode==='menu'){
    const st=thStats(thPool());
    const chips=['all',...TPARTS].map(p=>{const n=p==='all'?TQ.length:TQ.filter(q=>q.p===p).length;return `<button class="chip ${TH.part===p?'on':''}" onclick="TH.part='${p.replace(/'/g,"\\'")}';render(true)">${p==='all'?'Tout':p} · ${n}</button>`;}).join('');
    return top+`<div class="panel"><h2>Questions de cours</h2><p class="small mut" style="margin:6px 0 10px">Un QCM pour chaque question : 4 réponses, une seule bonne. Touche 🔊 pour écouter la question et les réponses. Tes erreurs sont gardées sur ce téléphone pour les revoir.</p><div class="chips">${chips}</div></div>
    <div class="panel"><div class="row between small"><span>✅ Sues : <b>${st.ok}</b></span><span>❌ À revoir : <b>${st.ko}</b></span><span>Pas vues : <b>${st.n-st.ok-st.ko}</b></span></div><div class="thbar"><i style="width:${st.n?Math.round(st.ok/st.n*100):0}%"></i></div></div>
    <button class="btn pri" onclick="thStart('all')">Quiz (ordre aléatoire)</button>
    <div class="two" style="margin-top:10px"><button class="btn" onclick="thStart('review')">❌ Revoir mes erreurs (${st.ko})</button><button class="btn" onclick="thStart('new')">🆕 Pas encore vues</button></div>
    <div class="two" style="margin-top:10px"><button class="btn" onclick="thStart('order')">Dans l'ordre du cours</button><button class="btn" onclick="thList()">📖 Tout lire</button></div>
    <p style="text-align:center"><button class="xbtn" onclick="thReset()">Remettre ma progression à zéro</button></p>`;
  }
  if(TH.mode==='list'){
    return top+`<p class="small mut">Touche une question pour voir sa réponse.</p>`+thPool().map(q=>`<div class="thli${D}" onclick="this.querySelector('.a').hidden=!this.querySelector('.a').hidden"><div class="small mut">${esc(q.p)} · n°${q.n} ${THM[q.n]===1?'✅':THM[q.n]===0?'❌':''}</div><b>${esc(q.q)}</b><div class="a" hidden>${esc(q.a)}${q.w?'<div class="small mut">⚠️ Pas clairement dans le cours : à confirmer avec ton prof.</div>':''}</div></div>`).join('');
  }
  if(TH.mode==='end'){
    const t=TH.ok+TH.ko;
    return top+`<div class="thq${D}" style="text-align:center"><div class="q">Série terminée !</div><p style="font-size:42px;margin:10px 0;font-weight:800">${TH.ok} / ${t}</p><p>${TH.ko?TH.ko+' question'+(TH.ko>1?'s':'')+' à revoir.':'Sans faute 🎉'}</p></div>
    ${TH.ko?`<button class="btn pri" onclick="thStart('review')">Revoir mes erreurs</button>`:''}<button class="btn" style="margin-top:10px" onclick="TH.mode='menu';render(true)">Retour au menu</button>`;
  }
  const q=TH.deck[TH.i],pc=Math.round(TH.i/TH.deck.length*100),good=q.c[0];
  const opts=TH.opts.map((o,k)=>{let cl='';if(TH.show){if(o===good)cl='good';else if(k===TH.pick)cl='bad';else cl='dim';}
    return `<button class="opt ${cl}${D}" onclick="thPick(${k})"><b>${'ABCD'[k]}</b><span>${esc(o)}</span>${TH.show&&o===good?'<i>✓</i>':TH.show&&k===TH.pick?'<i>✗</i>':''}</button>`;}).join('');
  const right=TH.show&&TH.opts[TH.pick]===good;
  return top+`<div class="row between small mut"><span>Question ${TH.i+1} / ${TH.deck.length}</span><span>✅ ${TH.ok} · ❌ ${TH.ko}</span></div><div class="thbar"><i style="width:${pc}%"></i></div>
  <div class="thq${D}"><div class="meta"><span>${esc(q.p)} · n°${q.n}</span><button class="spk" onclick="thSayQ()">🔊 Écouter</button></div>
  <div class="q">${esc(q.q)}</div></div>
  <div class="opts">${opts}</div>
  ${TH.show?`<div class="thq${D}" style="min-height:0"><div class="meta"><span style="font-size:15px;color:${right?'#1f7a45':'#b3261e'}">${right?'✅ Bonne réponse !':'❌ Pas tout à fait'}</span><button class="spk" onclick="thSayA()">🔊 Écouter</button></div><div class="a" style="margin-top:8px;border:0;padding-top:0">${esc(q.a)}</div>${q.w?'<div class="warn">⚠️ Pas clairement dans le cours : à confirmer avec ton prof.</div>':''}</div>
  <div class="bottom"><div><button class="btn pri" onclick="thNext()">${TH.i+1>=TH.deck.length?'Voir mon score':'Question suivante'}</button></div></div>`:''}`;
}

/* ================= RENDU ================= */
function render(force){
  if(!S.net&&TH.on){S.key='th';$('#app').innerHTML=vTheory();return;}
  const G=getG();let key;
  if(!S.net)key='home';else if(!G)key='wait:'+(S.seenHost?1:0);else key=G.phase+':'+(G.round||0)+':'+(S.sentRound===G.round?1:0);
  if(G&&G.phase==='play'&&S.formRound!==G.round){S.form=isTh(G)?{txt:''}:blank();S.formRound=G.round;S.t0=Date.now();force=true;}
  if(key===S.key&&!force&&G&&G.phase==='play'){const t=$('#tbl');if(t)t.outerHTML=vTable(G,'play',centerOf(G));const h=$('#hostbar');if(h)h.outerHTML=vHostBar(G);return;}
  if(key===S.key&&!force&&!S.net)return;
  S.key=key;const app=$('#app');
  if(!S.net)app.innerHTML=vHome();
  else if(!G)app.innerHTML=vWait();
  else if(G.phase==='lobby')app.innerHTML=vLobby(G);
  else if(G.phase==='play')app.innerHTML=vPlay(G);
  else if(G.phase==='reveal')app.innerHTML=vReveal(G);
  else app.innerHTML=vEnd(G);
  if(G&&G.phase==='reveal')S.flipped[G.round]=true;
}
function topbar(G){
  const mode=S.net.mode==='solo'?'Solo':'Table <b>'+esc(S.code)+'</b>';
  return `<div class="top"><span>${mode}${G&&G.round?` · Manche <b>${G.round}/${G.total}</b>`:''}</span><span class="row">${G&&G.phase==='play'?'<b id="timer">0 s</b>':''}<button class="xbtn" onclick="if(window.__q){quit()}else{window.__q=1;this.textContent='Sûr ?';setTimeout(()=>window.__q=0,2500)}">Quitter</button></span></div>`;
}
/* --- la table de jeu --- */
function seatOrder(ids){const m=ids.indexOf(myId());return m<0?ids:ids.slice(m).concat(ids.slice(0,m));}
function vTable(G,mode,centerHtml){
  const ids=mode==='lobby'?players().map(p=>p.id):G.players;
  const ord=seatOrder(ids),n=Math.max(ord.length,1);
  const parts=ord.map((id,k)=>{
    const ang=Math.PI/2+k*2*Math.PI/n,cx=Math.cos(ang),cy=Math.sin(ang);
    const tx=50+46*cx,ty=50+47*cy,sx=50+30*cx,sy=50+28*cy;
    const isMe=id===myId();
    const nm=esc(mode==='lobby'?(S.peers.find(p=>p.id===id)?.s.name||'Joueur'):nameOf(id,G));
    const host=mode==='lobby'&&S.peers.find(p=>p.id===id)?.s.role==='host'?'👑 ':'';
    let card='';
    if(mode==='play'){const k2=G.sub.indexOf(id);
      card=k2>=0?`<div class="slot" ${isMe?'id="slot-me"':''} style="left:${sx}%;top:${sy}%"><div class="cback drop"><span>${k2+1}</span></div></div>`
                :`<div class="slot empty" ${isMe?'id="slot-me"':''} style="left:${sx}%;top:${sy}%">✍️</div>`;}
    if(mode==='reveal'){const r=G.res[id]||{};const anim=!S.flipped[G.round];
      card=`<div class="slot" style="left:${sx}%;top:${sy}%"><div class="cface ${r.rk===1?'best':''} ${anim?'flipin':''}">${r.e==null?'<span class="e">—</span>':`<span class="e">${r.e===0?'★':isTh(G)?(r.e===1?'½':'✗'):r.e}</span><span class="p">+${r.pts}</span>`}</div></div>`;}
    return `<div class="tag ${isMe?'me':''}" style="left:${tx}%;top:${ty}%">${host}${nm}</div>${card}`;
  }).join('');
  return `<div class="tablewrap" id="tbl"><div class="ptable"><div class="center">${centerHtml||''}</div>${parts}</div></div>`;
}
function backs(n){return `<div class="cards">${Array.from({length:n},(_,i)=>`<div class="c" style="transform:rotate(${(i-(n-1)/2)*12}deg) translateY(${Math.abs(i-(n-1)/2)*6}px);margin:0 -10px"><div class="cback"><span>🍸</span></div></div>`).join('')}</div>`;}
function vHome(){
  return `<div class="home"><div class="hero">${backs(4)}<h1>Cocktail Rush</h1><p class="mut">${C.length} fiches techniques EBS. Écris la recette de mémoire, pose ta carte face cachée, le plus précis et le plus rapide gagne.</p></div>

}
function vWait(){return topbar(null)+(S.seenHost?`<div class="banner">L'hôte s'est déconnecté (écran verrouillé ?). Dès qu'il revient sur la page, la partie reprend.</div><button class="btn" onclick="quit()">Quitter la table</button>`:`<div class="panel" style="text-align:center"><h2>On rejoint la table ${esc(S.code)}…</h2><p class="mut">En attente de l'hôte.</p></div>`);}
function vLobby(G){
  const solo=S.net.mode==='solo';
  const center=solo?`<div class="lbl">Entraînement</div><div class="nm">Solo</div>`:`<div class="lbl">Code de la table</div><div class="code">${esc(S.code)}</div><div class="small" style="color:#d8f0df">${players().length} joueur${players().length>1?'s':''} assis</div>`;
  return topbar(null)+vTable(G,'lobby',center)+(solo?'':`<p class="small mut" style="text-align:center;margin:0">Tes amis ouvrent ce même lien, tapent ton prénom… et le code.</p>`)
  +(S.isHost?`<div class="panel"><div class="small mut" style="margin-bottom:8px">On joue à quoi ?</div><div class="chips"><button class="chip ${S.kind==='cocktail'?'on':''}" onclick="S.kind='cocktail';render(true)">🍸 Fiches cocktails</button><button class="chip ${S.kind==='theory'?'on':''}" onclick="S.kind='theory';render(true)">📚 Théorie</button></div>
  ${S.kind==='theory'?`<div class="small mut" style="margin:12px 0 8px">Partie du cours</div><div class="chips">${['all',...TPARTS].map(p=>`<button class="chip ${S.part===p?'on':''}" onclick="S.part='${p.replace(/'/g,"\\'")}';render(true)">${p==='all'?'Tout':p}</button>`).join('')}</div>`:''}
  <div class="small mut" style="margin:12px 0 8px">Nombre de manches</div><div class="chips">${(()=>{const mx=S.kind==='theory'?thIdx(S.part).length:C.length;return [5,10,15,20,mx].filter((n,i,a)=>n<=mx&&a.indexOf(n)===i).map(n=>`<button class="chip ${S.total===n?'on':''}" onclick="S.total=${n};render(true)">${n===mx?'Toutes ('+n+')':n}</button>`).join('');})()}</div></div>
  <div class="bottom"><div><button class="btn pri" onclick="startGame()">${S.kind==='theory'?'Poser la première question':solo?'Distribuer':'Distribuer les cartes'}</button></div></div>`
  :`<div class="panel" style="text-align:center"><p class="mut" style="margin:0">L'hôte va distribuer…</p></div>`);
}
function vHostBar(G){if(!S.isHost||S.net.mode==='solo'||G.phase!=='play')return '<div id="hostbar"></div>';
  return `<div id="hostbar">${G.sub.length&&G.sub.length<G.players.length?`<button class="btn" onclick="doReveal()">Retourner les cartes maintenant (${G.sub.length}/${G.players.length})</button>`:''}</div>`;}
function hw(field,ph,max,extra=''){return `<input class="hw" value="${esc(S.form[field])}" maxlength="${max}" placeholder="${ph}" oninput="S.form.${field}=this.value" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" ${extra}>`;}
function irow(i){const r=S.form.ing[i];return `<div class="irow"><input class="hw" value="${esc(r[0])}" maxlength="40" placeholder="${i===0?'ingrédient…':''}" oninput="S.form.ing[${i}][0]=this.value;autoRow(${i})" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"><input class="hw q" value="${esc(r[1])}" maxlength="16" placeholder="${i===0?'dose':''}" oninput="S.form.ing[${i}][1]=this.value" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"></div>`;}
function autoRow(i){if(i===S.form.ing.length-1&&S.form.ing.length<10)addRow();}
function addRow(){if(S.form.ing.length>=10)return;S.form.ing.push(['','']);const box=document.getElementById('irows');if(box)box.insertAdjacentHTML('beforeend',irow(S.form.ing.length-1));}
function vPlayTh(G){
  const q=TQ[G.cid];const head=topbar(G)+vTable(G,'play',centerOf(G));
  if(S.sentRound===G.round)return head+`<div class="panel" style="text-align:center"><h2>Réponse posée face cachée</h2><p class="mut" style="margin:6px 0 0">${S.net.mode==='solo'?'':'On retourne toutes les cartes dès que tout le monde a répondu.'}</p></div>${vHostBar(G)}`;
  return head+vHostBar(G)+`<div class="paper${TH.big?' dys':''}"><div class="row between"><span class="small" style="color:#7a6a55;font-weight:600">${esc(q.p)} · n°${q.n}</span><button class="spk" onclick="thSay(TQ[getG().cid].q)">🔊 Écouter</button></div>
    <div style="font:800 21px/1.3 'Bricolage Grotesque',Inter,sans-serif;margin:8px 0 10px">${esc(q.q)}</div>
    <textarea class="hw tha" rows="4" maxlength="300" placeholder="Ta réponse… (pas besoin de tout écrire mot pour mot)" oninput="S.form.txt=this.value" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">${esc(S.form.txt)}</textarea>
    <p class="small" style="color:#7a6a55;margin:6px 0 0">Écris les mots importants : l'orthographe et l'ordre des phrases ne comptent pas.</p>
  </div><div class="bottom"><div><button class="btn red" onclick="submitCard()">Poser ma réponse sur la table</button></div></div>`;
}
function vPlay(G){
  if(isTh(G))return vPlayTh(G);
  const c=C[G.cid];
  const center=`<div class="lbl">Cocktail</div><div class="nm">${esc(c.n)}</div>`;
  const head=topbar(G)+vTable(G,'play',center);
  if(S.sentRound===G.round)
    return head+`<div class="panel" style="text-align:center"><h2>Carte posée face cachée</h2><p class="mut" style="margin:6px 0 0">${S.net.mode==='solo'?'':'On retourne toutes les cartes dès que tout le monde a posé la sienne.'}</p></div>${vHostBar(G)}`;
  return head+vHostBar(G)+`<div class="paper">
    <div class="ttl">${esc(c.n)}</div>
    <div class="fl"><label>Verre :</label>${hw('g','',30)}</div>
    <div class="fl"><label>Glaçons :</label>${hw('i','',20)}</div>
    <div class="fl"><label>Technique :</label>${hw('t','',60)}</div>
    <div class="ihead"><span>Ingrédients</span><span>Dose</span></div>
    <div id="irows">${S.form.ing.map((_,i)=>irow(i)).join('')}</div>
    <button class="addl" onclick="addRow()">+ une ligne</button>
    <div class="fl" style="border-top:2px solid #2b2118"><label>Décoration :</label>${hw('gar','',60)}</div>
  </div><div class="bottom"><div><button class="btn red" onclick="submitCard()">Envoyer la carte sur la table</button></div></div>`;
}
function vRecipe(c){
  return `<div class="paper recipe" style="margin-top:14px"><div class="ttl">${esc(c.n)} · la bonne fiche</div>
  <div class="r"><span>Verre</span><span>${esc(c.g.join(' / '))}</span></div>
  <div class="r"><span>Glaçons</span><span>${esc(c.i.join(' / '))}</span></div>
  <div class="r"><span>Technique</span><span>${esc(c.t.join(' / '))}</span></div>
  ${c.ing.map(([n,q])=>`<div class="r"><span>${esc(fname(n))}</span><span>${esc(fq(q))}</span></div>`).join('')}
  <div class="r"><span>Décoration</span><span>${esc(c.gar.map(a=>a.length?a.join(' + '):'None').join(' ou '))}</span></div>
  ${c.o?`<p class="small" style="margin:8px 4px 2px;color:#5a4a38">Options : ${esc(c.o)}</p>`:''}</div>`;
}
function vRevealTh(G){
  const q=TQ[G.cid];const order=G.players.slice().sort((a,b)=>(G.res[a].rk||99)-(G.res[b].rk||99));const medals=['🥇','🥈','🥉'];
  const center=`<div class="lbl">Cartes retournées</div><div class="nm" style="font-size:15px">${esc(q.p)}</div>`;
  const rows=order.map(id=>{const r=G.res[id];const a=(G.ans&&G.ans[id]!==undefined)?G.ans[id]:(S.peers.find(p=>p.id===id)?.s.ans);
    const tx=a&&a.txt||'';const gr=r.e!=null?thGradeTxt(tx,q):null;
    const fixb=S.isHost&&r.e!=null?`<div class="row" style="gap:6px;margin-top:8px">${[0,1,2].map(e=>`<button class="chip ${r.e===e?'on':''}" style="padding:6px 10px;font-size:13px" onclick="event.stopPropagation();hostVerdict('${id}',${e})">${TV[e]}</button>`).join('')}</div>`:'';
    return `<div class="panel prow"><div class="row between"><div class="row"><span style="font-size:24px">${r.e===2?'❌':r.rk?medals[r.rk-1]||'🍹':'⏳'}</span><div><b>${esc(nameOf(id,G))}</b>${id===myId()?'<span class="you">toi</span>':''}<div class="small mut">${r.e==null?'Pas de réponse':TV[r.e]+(r.fix?' (corrigé par l\'hôte)':'')+(gr&&!r.fix?` · ${gr.hit}/${gr.n} idée${gr.n>1?'s':''}`:'')}${r.o?` · n°${r.o} en ${G.subT[id]} s`:''}</div></div></div><span class="pts">+${r.pts}</span></div>
    ${r.e!=null?`<div class="det" style="font:600 20px/1.3 Caveat,cursive;color:#d8e8ff">« ${esc(tx||'—')} »</div>`:''}${fixb}</div>`;}).join('');
  return topbar(G)+vTable(G,'reveal',center)+`<div class="thq${TH.big?' dys':''}"><div class="meta"><span>Question n°${q.n}</span><button class="spk" onclick="thSay(TQ[getG().cid].a.replace(/\n/g,'. '))">🔊 Écouter</button></div><div class="q" style="font-size:18px">${esc(q.q)}</div><div class="a">${esc(q.a)}</div>${q.w?'<div class="warn">⚠️ Pas clairement dans le cours : à confirmer avec ton prof.</div>':''}</div>`
   +rows+(S.isHost&&S.net.mode!=='solo'?'<p class="small mut" style="text-align:center">Hôte : touche ✅ / 🟡 / ❌ pour corriger un verdict si la machine s\'est trompée.</p>':S.isHost?'<p class="small mut" style="text-align:center">Tu peux corriger le verdict si la machine s\'est trompée.</p>':'')+vScores(G)
   +(S.isHost?`<div class="bottom"><div><button class="btn pri" onclick="nextRound()">${G.round>=G.total?'Classement final':'Question suivante'}</button></div></div>`:`<p class="mut" style="text-align:center">L'hôte pose la question suivante…</p>`);
}
function vReveal(G){
  if(isTh(G))return vRevealTh(G);
  const c=C[G.cid];
  const order=G.players.slice().sort((a,b)=>(G.res[a].rk||99)-(G.res[b].rk||99));
  const medals=['🥇','🥈','🥉'];
  const center=`<div class="lbl">Cartes retournées</div><div class="nm">${esc(c.n)}</div>`;
  const rows=order.map(id=>{
    const r=G.res[id];const a=(G.ans&&G.ans[id]!==undefined)?G.ans[id]:(S.peers.find(p=>p.id===id)?.s.ans);
    const gr=r.e!=null&&a?grade(a,c):null;const key=G.round+':'+id;const open=S.open[key]??(id===myId());
    const det=gr&&open?`<div class="det">${gr.items.map(it=>`<div class="it"><span class="s ${it.ok?'ok':'ko'}">${it.ok?'✓':'✗'}</span><span style="flex:1"><b>${esc(it.label)}</b> : <span class="${it.ok?'':'ko'}">${esc(it.given)}</span>${it.ok?'':` <span class="mut">→ ${esc(it.exp)}</span>`}${!it.ok&&it.und&&nz(it.und)!==nz(it.label)&&nz(it.und)!==nz(it.given)?` <span class="small mut">(compris : ${esc(it.und)})</span>`:''}</span></div>`).join('')}</div>`:'';
    return `<div class="panel prow" data-k="${esc(key)}" onclick="S.open[this.dataset.k]=${!open};render(true)"><div class="row between"><div class="row"><span style="font-size:24px">${r.rk?medals[r.rk-1]||'🍹':'⏳'}</span><div><b>${esc(nameOf(id,G))}</b>${id===myId()?'<span class="you">toi</span>':''}<div class="small mut">${r.e==null?'Pas de carte posée':(r.e===0?'Carte parfaite !':r.e+' erreur'+(r.e>1?'s':''))}${r.o?` · posée n°${r.o} en ${G.subT[id]} s`:''}</div></div></div><span class="pts">+${r.pts}</span></div>${det}${gr?`<div class="small mut" style="margin-top:4px">${open?'▲ masquer':'▼ voir sa carte'}</div>`:''}</div>`;
  }).join('');
  return topbar(G)+vTable(G,'reveal',center)+rows+vRecipe(c)+vScores(G)
   +(S.isHost?`<div class="bottom"><div><button class="btn pri" onclick="nextRound()">${G.round>=G.total?'Classement final':'Manche suivante'}</button></div></div>`:`<p class="mut" style="text-align:center">L'hôte distribue la manche suivante…</p>`);
}
function vScores(G){const ids=Object.keys(G.scores).sort((a,b)=>G.scores[b]-G.scores[a]);
  return `<div class="panel"><div class="small mut" style="margin-bottom:4px">Classement</div>${ids.map((id,k)=>`<div class="score"><span>${k+1}. ${esc(nameOf(id,G))}${id===myId()?'<span class="you">toi</span>':''}</span><b>${G.scores[id]} pts</b></div>`).join('')}</div>`;}
function vEnd(G){const ids=Object.keys(G.scores).sort((a,b)=>G.scores[b]-G.scores[a]);
  const pod=[ids[1],ids[0],ids[2]].map((id,k)=>id?`<div class="pod"><div class="small"><b>${esc(nameOf(id,G))}</b></div><div class="small mut">${G.scores[id]} pts</div><div class="bar" style="height:${[90,130,64][k]}px">${[2,1,3][k]}</div></div>`:'<div class="pod"></div>').join('');
  return topbar(null)+`<div class="hero"><div style="font-size:54px">🏆</div><h1>${esc(nameOf(ids[0],G))} gagne !</h1></div><div class="podium">${pod}</div>${vScores(G)}`
   +(S.isHost?`<div class="bottom"><div><button class="btn pri" onclick="backToLobby()">Nouvelle partie</button></div></div>`:`<button class="btn" onclick="quit()">Quitter</button>`);}
render(true);
</script>
<button id="instBtn" onclick="doInstall()" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:99;background:#ffc94a;color:#2a1a00;border:0;border-radius:999px;padding:12px 20px;font:700 15px Inter,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.4)">📲 Installer l'appli</button>
<script>
/* PWA : installation comme une appli */
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let _instEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();_instEvt=e;const b=document.getElementById('instBtn');if(b)b.style.display='block';});
addEventListener('appinstalled',()=>{_instEvt=null;const b=document.getElementById('instBtn');if(b)b.style.display='none';});
async function doInstall(){if(!_instEvt)return;_instEvt.prompt();await _instEvt.userChoice.catch(()=>{});_instEvt=null;document.getElementById('instBtn').style.display='none';}
</script>
</body>
